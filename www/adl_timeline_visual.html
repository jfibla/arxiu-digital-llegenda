<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arxiu digital d'una llegenda · Cronologia visual v4</title>
<style>
:root{
  --bg:#f7f3ed;--panel:#fffdf9;--ink:#27312e;--muted:#65706a;
  --line:#a5cb8d;--line-edge:#618c54;--shadow:#00000018;
  --wine:#8d4a57;--ochre:#b48338;--blue:#6b8090;--gray:#86867d;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#faf7f2,#f4f0e8);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#fff;border-bottom:1px solid #ddd7cc;padding:22px max(24px,calc((100vw - 1220px)/2));}
header h1{font-family:Georgia,serif;margin:0;font-size:clamp(26px,3vw,38px);line-height:1.08}
header p{margin:8px 0 0;color:var(--muted)}
main{max-width:990px;margin:22px auto;padding:0 20px 60px}
.intro{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.intro p{color:var(--muted);max-width:760px;line-height:1.55;margin:0}
.reset{border:1px solid #c9c5bc;background:#fff;border-radius:10px;padding:10px 15px;cursor:pointer}
.key{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 25px;font-size:12px;color:#505b55}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
.stage{position:relative;padding:20px 8px 14px;border-radius:22px;background:linear-gradient(#fffefb,#fbf8f2);border:1px solid #e2ddd3;box-shadow:0 10px 40px #3333330b;overflow:hidden}
.timeline{display:block;width:100%;height:auto;overflow:visible}
.route{stroke:var(--line);stroke-width:24;stroke-linecap:round;fill:none}
.route-glow{stroke:#d8ead0;stroke-width:34;stroke-linecap:round;fill:none;opacity:.7}
.route-core{stroke:var(--line-edge);stroke-width:2;stroke-dasharray:2 10;fill:none;opacity:.4}
.period{cursor:pointer;outline:none}
.period rect{fill:#fffdfa;stroke:#d7d1c7;stroke-width:1.5;filter:drop-shadow(0 3px 6px #00000010)}
.period .date{font:bold 20px system-ui;fill:#34453c}
.period .name{font:13px system-ui;fill:#656f69}
.period .number{font:bold 11px system-ui;fill:#769468;letter-spacing:.18px}
.period.active rect{stroke:#6f9961;stroke-width:3;fill:#f1f8ed}
.period.active .date{fill:#426d3b}
.period:hover rect,.period:focus rect{stroke:#719969;stroke-width:2.5}
.anchor{fill:#fff;stroke:#5b874f;stroke-width:5}
.connector{stroke:#789e6e;stroke-width:2.1;fill:none}
.hint{text-align:center;font-size:12px;color:#76827b;margin-top:8px}
.footer{color:#777e77;font-size:12px;margin-top:15px;text-align:center}
.watermark{pointer-events:none}
.period-panel-wrap[hidden]{display:none!important}
.period-panel-wrap{position:fixed;inset:0;z-index:45;background:rgba(11,33,23,.62);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.period-panel{background:#fffdf9;width:min(900px,100%);max-height:min(84vh,840px);display:flex;flex-direction:column;border-radius:18px;box-shadow:0 20px 80px #0005;overflow:hidden}
.detailhead{padding:20px 24px;border-bottom:1px solid #ece8e0;display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-shrink:0}
.detailhead h2{font-family:Georgia,serif;font-size:25px;margin:3px 0 5px}
.detailhead p{color:var(--muted);margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#77956a;text-transform:uppercase}
.collapse{background:#f5f4ef;border:1px solid #dad9d2;padding:9px 13px;border-radius:8px;cursor:pointer}
.events{padding:22px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px;overflow-y:auto;min-height:0}
.event{border:1px solid #e0ddd6;border-left:5px solid var(--gray);border-radius:9px;background:#fdfcf9;padding:14px;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s}
.event:hover{transform:translateY(-2px);box-shadow:0 4px 18px #00000015}.event time{display:block;font-size:12px;color:#69756e;margin-bottom:5px}.event strong{display:block;font-size:15px;line-height:1.35}.event small{display:block;margin-top:9px;color:#7c867e}.event.context{border-left-color:var(--gray)}.event.negative{border-left-color:var(--blue)}.event.diffusion{border-left-color:var(--ochre)}.event.critique{border-left-color:var(--wine)}
.modal{position:fixed;inset:0;background:#0b2117a9;display:none;align-items:center;justify-content:center;padding:20px;z-index:70}.modal.show{display:flex}
.sheet{background:#fffdf9;max-width:580px;width:100%;border-radius:15px;padding:28px;box-shadow:0 20px 80px #0006}.sheet h2{font-family:Georgia,serif;font-size:27px;margin:10px 0}.sheet p{line-height:1.6;color:#525e57}.sheet .top{display:flex;justify-content:space-between;align-items:center}.sheet button{border:1px solid #d7d4cc;background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}.notice{font-size:12px;color:#788078;margin-top:18px;background:#f2f0e9;padding:12px;border-radius:8px}
body.dialog-open{overflow:hidden}
@media(max-width:720px){.stage{overflow-x:auto}.timeline{min-width:900px}.period-panel-wrap{padding:12px}.period-panel{max-height:90vh}.events{grid-template-columns:1fr;padding:16px}.detailhead h2{font-size:22px}}

body{background:transparent}main{margin:0 auto;padding:0;max-width:980px}.stage{box-shadow:none;border:none;background:transparent;padding:8px 4px}.hint{font-size:11px}.period-panel-wrap{position:fixed}.timeline{max-width:100%}
</style>

<style>

html, body {
  max-width:100%;
}
main, .stage {
  box-sizing:border-box;
  min-width:0;
  max-width:100%;
}
.stage {
  overflow-x:auto;
  overflow-y:visible;
}
svg.timeline {
  display:block;
  width:100%;
  min-width:0 !important;
  max-width:100%;
  height:auto;
}
@media(max-width:720px) {
  .timeline {
    min-width:0 !important;
  }
  main {
    padding-left:8px;
    padding-right:8px;
  }
  .stage {
    padding:10px 4px;
  }
}
</style>

</head>

const detail=document.getElementById('detail');
const esc=(v)=>String(v??'');
function kindClass(category){let x=esc(category).toLowerCase();if(/cr[ií]t|critic/.test(x))return 'critique';if(/control|negat|silenc/.test(x))return 'negative';if(/difus|narrat|llegend|literat|premsa/.test(x))return 'diffusion';return 'context';}
function openPeriod(id){
 current=current===id?null:id;
 document.querySelectorAll('.period').forEach(el=>el.classList.toggle('active',el.dataset.p===current));
 if(!current){detail.hidden=true;document.body.classList.remove('dialog-open');return;}
 let p=periods[current][lang];
 document.getElementById('periodtitle').textContent=p[0];
 document.getElementById('perioddesc').textContent=p[1];
 const list=document.getElementById('events');list.replaceChildren();
 let selected=rows.filter(x=>x.period===current);
 if(!selected.length){let t=document.createElement('p');t.textContent=lang==='es'?'No hay fichas públicas para este período.':'No hi ha fitxes públiques en aquest període.';list.appendChild(t);}
 selected.forEach(x=>{
   const b=document.createElement('button');b.className='event '+kindClass(x.category);
   const time=document.createElement('time');time.textContent=x.year_label||'—';
   const name=document.createElement('strong');name.textContent=x.title;
   const hint=document.createElement('small');hint.textContent=lang==='es'?'Abrir ficha ↗':'Obre la fitxa ↗';
   b.append(time,name,hint);
   b.addEventListener('click',()=>window.parent.postMessage({source:'adl_timeline_visual',type:'open-item',item_id:x.item_id},window.location.origin));
   list.appendChild(b);
 });
 detail.hidden=false;document.body.classList.add('dialog-open');document.getElementById('close').focus();
}
function closePeriod(){if(current)openPeriod(current);}
document.querySelectorAll('.period').forEach(e=>{e.addEventListener('click',()=>openPeriod(e.dataset.p));e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openPeriod(e.dataset.p)}});});
document.getElementById('close').addEventListener('click',closePeriod);
const resetButton=document.getElementById('reset');if(resetButton)resetButton.addEventListener('click',closePeriod); // ADL_TIMELINE_FIX_V4
detail.addEventListener('click',e=>{if(e.target===detail)closePeriod()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePeriod()});
window.addEventListener('message',e=>{
 if(e.origin!==window.location.origin||e.source!==window.parent)return;
 const m=e.data;if(!m||m.source!=='adl_shiny_timeline'||m.type!=='data')return;
 rows=Array.isArray(m.events)?m.events:[];lang=m.lang==='es'?'es':'ca';document.documentElement.lang=lang;
 if(current){const id=current;current=null;openPeriod(id);}
});
window.parent.postMessage({source:'adl_timeline_visual',type:'ready'},window.location.origin);
</script>
</body>
</html>
